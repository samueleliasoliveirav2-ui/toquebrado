<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- MONOGRAMA TQ (Favicon mini 16x16 LEGIVEL)
       - Turquesa KOEE como ponto focal
       - Preto fundo
       - Traços grossos
       - "Circulo" TQ interligado
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#0C1F3A"/>
    </linearGradient>
    <linearGradient id="k" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Fundo quadrado com cantos arredondados (16x16) -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#g)"/>

  <!-- T grande turquesa, Q branco com detalhe, estilo monograma -->
  <!-- Haste vertical T (KOEE turquesa gradiente) -->
  <rect x="108" y="120" width="296" height="72" rx="32" fill="url(#k)"/>
  <rect x="220" y="120" width="72" height="272" rx="32" fill="url(#k)"/>

  <!-- Q branco (em baixo, circular) -->
  <circle cx="256" cy="340" r="120" fill="none" stroke="#FFFFFF" stroke-width="60"/>
  <rect x="336" y="402" width="80" height="60" rx="24" fill="#FFFFFF" transform="rotate(35 376 432)"/>

  <!-- Ponto extra turquesa (destaque "KOEE") no canto superior direito -->
  <circle cx="420" cy="92" r="26" fill="url(#k)"/>
</svg>

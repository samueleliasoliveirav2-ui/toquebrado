<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <!-- ============================================================
       MARCA COMPLETA - FAVICON_2 enviado usuario (GRADIENTE PRATA)
       Layout EXATO da imagem PNG enviada:
       - FUNDO GRADIENTE HORIZONTAL: #C5C5C5 (cinza prata, ESQUERDA) → #FFFFFF (branco, DIREITA)
       - Texto PRETO 100% #000000
       - KOEE, alinhado a DIREITA (linha de cima)
       - TÔQUEBRADO! alinhado a ESQUERDA (linha de baixo)
       - Circunflexo do Ô desenhado manualmente (triangulo isósceles)
    ============================================================ -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#C5C5C5"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <!-- Fundo GRADIENTE PRATA → BRANCO (igual imagem favicon_2) -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"/>

  <g fill="#000000" font-family="Arial Black, 'Arial Black', 'Helvetica Neue', Helvetica, ui-sans-serif, system-ui, sans-serif" font-weight="900" letter-spacing="-2">
    <!-- LINHA 1 (cima): KOEE, alinhado a DIREITA -->
    <text x="500" y="214" text-anchor="end" font-size="132">KOEE,</text>
    <!-- LINHA 2 (baixo): T_O_ QUEBRADO! - dividido para acento manual -->
    <text x="26"  y="404" font-size="144" letter-spacing="-2.6">TO</text>
    <text x="246" y="404" font-size="144" letter-spacing="-2.6">QUEBRADO!</text>
  </g>

  <!-- CIRCUNFLEXO DO Ô (TRIANGULO ISOSCELES GEOMETRICO PRETO) -->
  <polygon fill="#000000" stroke="none" points="166,246 121,278 211,278"/>
</svg>

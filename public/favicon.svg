<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bggrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a14"/>
      <stop offset="50%" stop-color="#0e1f35"/>
      <stop offset="100%" stop-color="#094d80"/>
    </linearGradient>
    <linearGradient id="knotgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e69b2"/>
      <stop offset="55%" stop-color="#094d80"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="crossgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bggrad)"/>
  <rect x="28" y="28" width="456" height="456" rx="88" fill="transparent" stroke="rgba(245,158,11,0.35)" stroke-width="2"/>

  <!-- Outer knot loop -->
  <path
    d="M256 92 C355.4 92 436 172.6 436 272 C436 330.2 408.6 382.2 364.5 417.5 C346.8 432.7 320.7 442 293.5 442 L293.5 412 C314.8 412 334.4 405 347.9 394.3 C381.9 366.7 405 322.3 405 272 C405 189.2 337.8 122 256 122 C174.2 122 107 189.2 107 272 C107 322.3 130.1 366.7 164.1 394.3 C177.6 405 197.2 412 218.5 412 L218.5 442 C191.3 442 165.2 432.7 147.5 417.5 C103.4 382.2 76 330.2 76 272 C76 172.6 156.6 92 256 92 Z"
    fill="none"
    stroke="url(#knotgrad)"
    stroke-width="16"

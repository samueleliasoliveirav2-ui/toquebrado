  <!-- Interlaced knot weave crossing -->
  <path d="M176 222 L336 382" stroke="#ffffff" stroke-width="22" stroke-linecap="round" opacity="0.95"/>
  <path d="M336 222 L176 382" stroke="url(#crossgrad)" stroke-width="22" stroke-linecap="round" opacity="0.95"/>

  <!-- Center diamond knot accent (laranja) -->
  <path d="M256 254 L284 282 L256 310 L228 282 Z" fill="#f59e0b" stroke="#d97706" stroke-width="3"/>

  <!-- Slim underline thread (orange) -->

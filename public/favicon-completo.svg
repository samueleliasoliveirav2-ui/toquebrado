<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fundo escuro tipo "tô na rua, mas com estilo" -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#0C1F3A"/>
      <stop offset="1" stop-color="#07243D"/>
    </linearGradient>
    <linearGradient id="koee" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Badge "KOEE," no topo direito (turquesa) -->
  <g font-family="Arial Black, ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="900" letter-spacing="-2">
    <text x="334" y="158" text-anchor="end" font-size="108" fill="url(#koee)">KOEE,</text>

    <!-- "TÔQUEBRADO!" (bloco principal BRANCO, peso pesado, leve inclinacao para atitude) -->
    <text x="56" y="348" font-size="118" fill="#FFFFFF" letter-spacing="-1.5">TÔQUEBRADO!</text>
  </g>

  <!-- Detalhe pequeno: underline fino turquesa abaixo (chamada visual para favicon 16px) -->
  <rect x="56" y="372" width="140" height="10" rx="5" fill="url(#koee)" opacity="0.9"/>
</svg>
